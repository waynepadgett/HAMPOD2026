name: HITL Tests

on:
  # Run on every PR targeting dev or main
  pull_request:
    branches:
      - dev
      - main
  # Also allow manual trigger on any branch from the GitHub Actions UI
  workflow_dispatch:

jobs:
  no-radio-tests:
    name: Audio + Keypad HITL Tests
    # Runs on the Pi 5 self-hosted runner registered to this repo
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run audio + keypad HITL tests
        run: bash hampod-hitl-test/run_no_radio_tests.sh

  radio-tests:
    name: Radio Control HITL Tests
    # Runs on the Pi 5 self-hosted runner registered to this repo
    # Script auto-skips (exit 0) if no radio is detected
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run radio HITL tests (skips if radio not connected)
        run: bash hampod-hitl-test/run_radio_tests.sh
